server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/devops_monitoring
    username: devops_user
    password: devops_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

jwt:
  secret: dev-development-secret-key-for-jwt-signing-change-in-production-must-be-at-least-256-bits
  expiration: 86400000  # 24 hours in ms

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
